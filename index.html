<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elle Choo — Design</title>
  <meta name="description" content="Graphic and interaction design portfolio of Elle Choo.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="nav-left" href="#about">About</a>
      <a class="nav-center" href="#">Elle Choo</a>

      <div class="nav-right">
        <button class="contact-toggle" id="contact-toggle" type="button" aria-haspopup="true" aria-expanded="false">Contact</button>
        <div class="contact-menu" id="contact-menu" hidden>
          <a id="contact-email-link" href="mailto:hello@example.com">Email</a>
          <a id="contact-linkedin-link" href="#" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- ===================== HOME VIEW ===================== -->
    <div id="home-view">

      <section class="project-list" id="project-list"></section>

      <div class="empty-state" id="empty-state" hidden>
        <p>Nothing posted yet — new work will show up here.</p>
      </div>

    </div>

    <!-- ===================== ABOUT VIEW ===================== -->
    <div id="about-view" hidden>
      <div class="about-main" id="about-content"></div>
    </div>

    <!-- ===================== PROJECT VIEW ===================== -->
    <div id="project-view" hidden>
      <a class="back-link" href="#">&larr; Back to work</a>

      <div class="project-layout">
        <div class="project-media" id="project-media"></div>

        <aside class="project-sidebar">
          <h1 id="project-title"></h1>
          <div class="project-meta" id="project-meta"></div>
          <p class="project-description" id="project-description"></p>
        </aside>
      </div>
    </div>

    <noscript>
      <p style="padding:48px 0;color:#6b6b6b;">This site needs JavaScript enabled to show the work.</p>
    </noscript>

  </main>

  <!-- ===================== LIGHTBOX ===================== -->
  <!-- Click an image, or a video's expand button, to zoom in. Carousels
       through the project's other media with the arrows / arrow keys. -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">&times;</button>
    <button class="lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous">&lsaquo;</button>
    <div class="lightbox-stage" id="lightbox-stage"></div>
    <button class="lightbox-next" id="lightbox-next" type="button" aria-label="Next">&rsaquo;</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <!-- All project content lives here. Edit it by opening admin.html
       locally and using the "Add / edit project" tool — it rewrites
       this block directly. Editing it by hand works too: it's just
       JSON. -->
  <script id="site-data" type="application/json">
{
  "site": {
    "name": "Elle Choo",
    "tagline": "Graphic & interaction design",
    "email": "hello@example.com",
    "linkedin": "https://www.linkedin.com/in/elle-choo-a069ba279/",
    "photo": "media/images/profile-633ddd57.jpg",
    "about": "Testing bio writing."
  },
  "projects": [
    {
      "id": "example-title",
      "title": "Example title",
      "year": "2026",
      "tag": "Data viz",
      "client": "Nobody lol",
      "summary": "Gallery caption testing",
      "description": "Description testing",
      "thumbnail": {
        "type": "image",
        "src": "media/images/example-title-0a6fbfe0.png"
      },
      "media": [
        {
          "type": "image",
          "src": "media/images/example-title-0a6fbfe0.png",
          "caption": "Caption testing"
        }
      ],
      "order": 1
    }
  ]
}
  </script>

  <script src="main.js" defer></script>
</body>
</html>
