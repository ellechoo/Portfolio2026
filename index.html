<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elle Choo — Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="nav-left" href="about.html">About</a>
      <a class="nav-center" href="index.html">Elle Choo</a>
      <a class="nav-right" href="mailto:you@email.com">Contact</a>
    </div>
  </header>

  <main class="wrap">

    <!-- A small, tight cluster of overlapping prints — plays once on
         load. Purely CSS; see .intro-pile / .pile-item in style.css. -->
    <div class="intro-pile">
      <div class="pile-item"><img src="images/project-1-thumb.jpg" alt=""></div>
      <div class="pile-item"><img src="images/project-2-thumb.jpg" alt=""></div>
      <div class="pile-item"><img src="images/project-3-thumb.jpg" alt=""></div>
      <div class="pile-item"><img src="images/project-4-thumb.jpg" alt=""></div>
      <div class="pile-item"><img src="images/project-5-thumb.jpg" alt=""></div>
    </div>

    <!-- Plain scroll from here down — one big image + caption per
         project, in normal document flow. -->
    <section class="project-list">

      <a class="project-row" href="projects/project-1.html">
        <div class="project-image">
          <img src="images/project-1-full.jpg" alt="Project One">
        </div>
        <div class="project-caption">
          <span class="tag">Identity</span>
          <span class="name">Project One</span>
        </div>
      </a>

      <a class="project-row" href="projects/project-1.html">
        <div class="project-image">
          <img src="images/project-2-full.jpg" alt="Project Two">
        </div>
        <div class="project-caption">
          <span class="tag">Data Viz</span>
          <span class="name">Project Two</span>
        </div>
      </a>

      <a class="project-row" href="projects/project-1.html">
        <div class="project-image">
          <img src="images/project-3-full.jpg" alt="Project Three">
        </div>
        <div class="project-caption">
          <span class="tag">Book Design</span>
          <span class="name">Project Three</span>
        </div>
      </a>

      <a class="project-row" href="projects/project-1.html">
        <div class="project-image">
          <img src="images/project-4-full.jpg" alt="Project Four">
        </div>
        <div class="project-caption">
          <span class="tag">Editorial</span>
          <span class="name">Project Four</span>
        </div>
      </a>

      <a class="project-row" href="projects/project-1.html">
        <div class="project-image">
          <img src="images/project-5-full.jpg" alt="Project Five">
        </div>
        <div class="project-caption">
          <span class="tag">Web</span>

      <a class="project-row" href="projects/project-1.html">

        </div>
        <div class="project-caption">
          <span class="tag">Motion</span>
          <span class="name">Project Six</span>
        </div>
      </a>

      <a class="project-row" href="projects/project-1.html">
        <div class="project-image">
          <img src="images/project-7-full.jpg" alt="Project Seven">
        </div>
        <div class="project-caption">
          <span class="tag">Poster</span>
          <span class="name">Project Seven</span>
        </div>

      <a class="project-row" href="projects/project-1.html">

        </div>
        <div class="project-caption">
          <span class="tag">Packaging</span>

  <script src="main.js" defer></script>
