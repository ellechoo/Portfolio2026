  <!--
    HOW THIS SECTION WORKS
    Each item below already sits in its real, final position — a cell in
    the 4x2 .work-grid. The data-ox / data-oy / data-orot / data-oscale
    attributes describe where that item starts on load (scattered, small,
    tilted) in viewport units. js/main.js reads those and eases the item
    back to its natural grid spot as you scroll through this section.
    To change how spread out an item starts, just edit its data-* numbers.
  -->
  <section class="hero-scatter">
    <div class="hero-pin">
      <div class="work-grid">

        <a class="scatter-item" href="projects/project-1.html"
           data-ox="-30" data-oy="-20" data-orot="-12" data-oscale="0.55">

            <img src="images/project-1-thumb.jpg" alt="Project One thumbnail">
            <div class="scatter-caption">

          </div>
        </a>
